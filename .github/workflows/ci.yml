name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: bun run build
      - name: Built script is committed and up to date
        run: git diff --exit-code skills/terminal-tab-title/scripts/tab-title.mjs
      - run: bun run test
